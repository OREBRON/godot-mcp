name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    name: test (${{ matrix.name }})
    # Self-hosted runners execute whatever a workflow gives them, so pull
    # requests from forks never run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: [self-hosted, macOS, ARM64]
          - name: macOS amd64
            runner: [self-hosted, macOS, X64]
          - name: Linux amd64
            runner: [self-hosted, Linux, X64]
          - name: Windows amd64
            runner: [self-hosted, Windows, X64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Show platform
        run: go env GOOS GOARCH

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -short -count=1 ./...

      - name: Install Godot
        if: runner.os != 'Windows'
        run: bash .github/scripts/install-godot.sh

      - name: Install Godot (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/install-godot.ps1

      - name: End-to-end tests (headless Godot editor)
        env:
          GODOT_MCP_E2E_REQUIRED: "1"
          # The tests keep their projects under the job's temp folder, which
          # the runner empties and the cleanup step below searches.
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test -count=1 -v ./e2e/

      - name: End leftover test processes
        if: always() && runner.os != 'Windows'
        run: bash .github/scripts/kill-test-processes.sh

      - name: End leftover test processes (Windows)
        if: always() && runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/kill-test-processes.ps1

  cross-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean
